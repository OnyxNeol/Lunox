name: Lunox Desktop Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  linux:
    name: "Linux desktop build"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps

      - name: Build (Release, run-in-place)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=TRUE
          cmake --build build --parallel "$(nproc)"

      - name: Package Lunox (engine + bundled game, devtest excluded)
        run: |
          mkdir -p package/Lunox
          cp -r build/* package/Lunox/ 2>/dev/null || true
          # Run-in-place layout: binaries live at repo root after build
          rsync -a --exclude 'games/devtest' --exclude '.git' \
            bin builtin client fonts games locale po textures \
            minetest.conf.example package/Lunox/ 2>/dev/null || true
          cd package
          zip -r -q ../Lunox-linux-x64.zip Lunox
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-linux-x64
          path: Lunox-linux-x64.zip
          if-no-files-found: warn

      - name: Build AppImage
        run: |
          set -e
          APPDIR="$GITHUB_WORKSPACE/AppImageDir"
          mkdir -p "$APPDIR"
          cp -r package/Lunox/* "$APPDIR/"

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/bin/luanti" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          printf '[Desktop Entry]\nName=Lunox\nExec=luanti\nIcon=lunox\nType=Application\nCategories=Game;\n' > "$APPDIR/lunox.desktop"

          cp misc/luanti-xorg-icon-128.png "$APPDIR/lunox.png"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "$GITHUB_WORKSPACE/Lunox-x86_64.AppImage"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-linux-appimage
          path: Lunox-x86_64.AppImage
          if-no-files-found: warn

  windows:
    name: "Windows desktop build (MinGW 64-bit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler + toolchain
        run: |
          source ./util/ci/common.sh
          install_mingw_deps 64 false
          sudo ./util/buildbot/download_toolchain.sh /usr

      - name: Build
        run: |
          EXISTING_MINETEST_DIR=$PWD ./util/buildbot/buildwin64.sh B
          mkdir -p artifact
          cp -v B/build/*.zip artifact/ || true

      - name: Repackage as Lunox (strip devtest, rename)
        run: |
          dest=$(mktemp -d)
          unzip -q -d "$dest" artifact/*.zip
          gamedir=$(find "$dest" -maxdepth 2 -type d -name 'games')
          rm -rf "$gamedir/devtest" || true
          cd "$dest"
          inner=$(ls)
          mv "$inner" Lunox
          zip -r -q "$GITHUB_WORKSPACE/Lunox-windows-x64.zip" Lunox
          echo "REPACK_DIR=$dest" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-windows-x64
          path: Lunox-windows-x64.zip
          if-no-files-found: warn

      - name: Build Windows installer (.exe)
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y nsis
          workdir=$(mktemp -d)
          cp -r "$REPACK_DIR/Lunox" "$workdir/Lunox"
          cp misc/luanti-icon.ico "$workdir/luanti-icon.ico"
          cp misc/lunox_installer.nsi "$workdir/lunox_installer.nsi"
          cd "$workdir"
          makensis -DVERSION_STRING="5.17.0" lunox_installer.nsi
          cp Lunox-windows-setup.exe "$GITHUB_WORKSPACE/Lunox-windows-setup.exe"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-windows-setup
          path: Lunox-windows-setup.exe
          if-no-files-found: warn

  macos:
    name: "macOS desktop build"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          echo "REPDIR=$(pwd)" >> $GITHUB_ENV
          echo "osver=11.3" >> $GITHUB_ENV
          echo "xcodever=16.2" >> $GITHUB_ENV
          echo "arch=arm64" >> $GITHUB_ENV
          echo "build_type=Release" >> $GITHUB_ENV

      - name: Install deps
        run: |
          mkdir downloads
          source ./util/ci/common.sh
          source ./util/ci/macos_sdk.sh
          install_macos_precompiled_deps 11.3 arm64
          install_macos_sdk 11.3 16.2 downloads

      - name: Build
        run: |
          mkdir build
          cd build
          export DEPS_DIR=/Users/Shared/macos11.3_arm64_deps
          export USE_XCODE=no
          ../util/ci/build_macos.sh

      - name: Strip devtest and package
        run: |
          set -e
          appdir=$(find build -maxdepth 2 -iname '*.app' | head -n1)
          echo "Found app bundle: $appdir"
          rm -rf "$appdir/Contents/Resources/games/devtest" || true
          mkdir -p build/macpkg
          rm -rf build/macpkg/Lunox.app
          cp -R "$appdir" build/macpkg/Lunox.app
          # Ad-hoc sign so the app launches without a "damaged" error.
          # (Not notarized -- users may need to right-click > Open the first time.)
          codesign --force --deep -s - build/macpkg/Lunox.app || true
          cd build/macpkg
          zip -r -q "$GITHUB_WORKSPACE/Lunox-macos.zip" Lunox.app

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-macos
          path: Lunox-macos.zip
          if-no-files-found: warn

      - name: Build DMG
        run: |
          set -e
          hdiutil create -volname "Lunox" -srcfolder build/macpkg/Lunox.app \
            -ov -format UDZO "$GITHUB_WORKSPACE/Lunox-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Lunox-macos-dmg
          path: Lunox-macos.dmg
          if-no-files-found: warn

  release:
    name: "Publish Lunox release"
    needs: [linux, windows, macos]
    if: always() && (needs.linux.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lunox-latest
          name: "Lunox Desktop Build (latest)"
          body: |
            Automated desktop build of Lunox — engine + VoxeLibre-based core game + Copper Spring Launchpad feature.

            - `Lunox-windows-x64.zip` — portable Windows build (no install needed)
            - `Lunox-windows-setup.exe` — Windows installer (Start Menu + Desktop shortcuts, uninstaller)
            - `Lunox-macos.zip` — portable macOS .app bundle
            - `Lunox-macos.dmg` — macOS disk image (drag Lunox.app to Applications). Not notarized — right-click > Open the first time.
            - `Lunox-linux-x64.zip` — portable Linux build
            - `Lunox-x86_64.AppImage` — Linux AppImage (chmod +x, then run directly)
          files: artifacts/**/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
